<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل / دخول</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f0f0f0;
    padding: 50px;
}

button {
    padding: 15px 30px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    margin: 10px;
}

button:hover:not([disabled]) {
    background-color: #45a049;
}

button[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
}

form {
    display: none;
    margin-top: 20px;
}

input {
    padding: 10px;
    margin: 10px 0;
    width: 80%;
    max-width: 300px;
}

.homePage {
    display: none;
}
</style>
</head>
<body>

<h1>مرحبا بك!</h1>

<div id="mainButtons">
    <button id="signUpBtn">إنشاء حساب</button>
    <button id="loginBtn">تسجيل الدخول</button>
</div>

<!-- Sign Up Form -->
<form id="signUpForm">
    <h3>إنشاء حساب جديد</h3>
    <input type="text" id="signupName" placeholder="اسمك" required><br>
    <input type="email" id="signupEmail" placeholder="الإيميل" required><br>
    <input type="password" id="signupPassword" placeholder="كلمة المرور" required><br>
    <button type="submit">أرسل رسالة التأكيد</button>
</form>

<!-- Login Form -->
<form id="loginForm">
    <h3>تسجيل الدخول</h3>
    <input type="email" id="loginEmail" placeholder="الإيميل" required><br>
    <input type="password" id="loginPassword" placeholder="كلمة المرور" required><br>
    <button type="submit">تسجيل الدخول</button>
</form>

<div class="homePage" id="homePage">
    <h1>الصفحة الرئيسية</h1>
    <p>أنت الآن مسجل ومؤكد!</p>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("S1Mw-eSIERnBhM8ri");
</script>

<script>
const signUpBtn = document.getElementById("signUpBtn");
const loginBtn = document.getElementById("loginBtn");
const mainButtons = document.getElementById("mainButtons");

const signUpForm = document.getElementById("signUpForm");
const loginForm = document.getElementById("loginForm");
const homePage = document.getElementById("homePage");

// تحقق إذا الجهاز مسجل مسبقاً
if(localStorage.getItem("isRegistered") === "true") {
    mainButtons.style.display = "none";
    signUpForm.style.display = "none";
    loginForm.style.display = "none";
    homePage.style.display = "block";
}

// عرض فورم Sign Up
signUpBtn.onclick = () => {
    mainButtons.style.display = "none";
    signUpForm.style.display = "block";
};

// عرض فورم Login
loginBtn.onclick = () => {
    mainButtons.style.display = "none";
    loginForm.style.display = "block";
};

// إرسال رسالة التأكيد Sign Up
signUpForm.onsubmit = function(e) {
    e.preventDefault();

    const name = document.getElementById("signupName").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;

    // حفظ معلومات التسجيل مؤقتاً (يمكن تحسينها لاحقاً مع DB)
    localStorage.setItem("signupEmail", email);
    localStorage.setItem("signupPassword", password);

    // رابط التأكيد
    const confirmLink = `https://testsiteoussama.github.io/Testsite/confirm.html?email=${encodeURIComponent(email)}`;

    emailjs.send(
        "service_j39gu7v",
        "template_r2sxa0o",
        {
            user_name: name,
            to_email: email,
            from_name: "موقع التسجيل",
            reply_to: email,
            message: `✅ اضغط على هذا الرابط لتأكيد حسابك: <a href="${confirmLink}" style="color:white; background-color:#4CAF50; padding:5px 10px; text-decoration:none; border-radius:5px;">[تأكيد الحساب]</a>\nكلمة المرور: ${password}`
        }
    )
    .then(() => {
        alert("📩 تم إرسال رسالة التأكيد إلى إيميلك. اضغط على الرابط داخل الرسالة لتفعيل الحساب.");
        signUpForm.reset();
        signUpForm.style.display = "none";
        mainButtons.style.display = "block";
    })
    .catch((error) => {
        alert("❌ خطأ في الإرسال");
        console.log(error);
    });
};

// تسجيل الدخول Login
loginForm.onsubmit = function(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    // تحقق من بيانات التسجيل
    const savedEmail = localStorage.getItem("signupEmail");
    const savedPassword = localStorage.getItem("signupPassword");
    const isConfirmed = localStorage.getItem("isRegistered");

    if(email === savedEmail && password === savedPassword && isConfirmed === "true") {
        alert("✅ تسجيل الدخول ناجح!");
        loginForm.style.display = "none";
        homePage.style.display = "block";
    } else {
        alert("❌ بيانات غير صحيحة أو الحساب لم يتم تأكيده بعد.");
    }
};
</script>

</body>
</html>
