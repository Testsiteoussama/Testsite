<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل / دخول</title>
<style>
body { font-family: Arial; text-align:center; background:#f0f0f0; padding:40px; }
button { padding:12px 25px; margin:10px; border:none; border-radius:6px; background:#4CAF50; color:white; cursor:pointer; }
input { display:block; margin:10px auto; padding:10px; width:260px; }
form { display:none; }
</style>
</head>
<body>

<h1>مرحبا بك</h1>

<div id="buttons">
    <button onclick="showSignup()">إنشاء حساب</button>
    <button onclick="showLogin()">تسجيل الدخول</button>
</div>

<form id="signupForm">
    <h3>إنشاء حساب</h3>
    <input type="email" id="suEmail" placeholder="الإيميل" required>
    <input type="password" id="suPassword" placeholder="كلمة المرور" required>
    <button type="submit">إرسال رسالة التأكيد</button>
</form>

<form id="loginForm">
    <h3>تسجيل الدخول</h3>
    <input type="email" id="liEmail" placeholder="الإيميل" required>
    <input type="password" id="liPassword" placeholder="كلمة المرور" required>
    <button type="submit">دخول</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("S1Mw-eSIERnBhM8ri");

/* ====== AUTO LOGIN ====== */
if (
    localStorage.getItem("loggedIn") === "true" &&
    localStorage.getItem("currentUser")
) {
    window.location.href = "home.html";
}

/* ====== HELPERS ====== */
function getAccounts(){ return JSON.parse(localStorage.getItem("accounts")) || []; }
function saveAccounts(acc){ localStorage.setItem("accounts", JSON.stringify(acc)); }

/* ====== UI ====== */
function showSignup(){ buttons.style.display="none"; signupForm.style.display="block"; }
function showLogin(){ buttons.style.display="none"; loginForm.style.display="block"; }

/* ====== SIGN UP ====== */
signupForm.onsubmit = function(e){
    e.preventDefault();

    const email = suEmail.value;
    const password = suPassword.value;

    let accounts = getAccounts();
    if(accounts.find(a=>a.email===email)){
        alert("❌ هذا الإيميل مسجل مسبقاً");
        return;
    }

    accounts.push({ email, password, confirmed:false });
    saveAccounts(accounts);

    const confirmLink =
    `https://testsiteoussama.github.io/Testsite/confirm.html?email=${encodeURIComponent(email)}`;

    emailjs.send(
        "service_j39gu7v",
        "template_r2sxa0o",
        {
            to_email: email,
            message: `اضغط هنا لتأكيد حسابك:
            <a href="${confirmLink}"
            style="display:inline-block;padding:8px 15px;background:#4CAF50;color:white;border-radius:5px;text-decoration:none">
            [تأكيد الحساب]</a>`
        }
    ).then(()=>{
        alert("📩 تم إرسال رسالة التأكيد");
        signupForm.reset();
        signupForm.style.display="none";
        buttons.style.display="block";
    });
};

/* ====== LOGIN ====== */
loginForm.onsubmit = function(e){
    e.preventDefault();

    const email = liEmail.value;
    const password = liPassword.value;

    let accounts = getAccounts();
    let user = accounts.find(
        a => a.email===email && a.password===password && a.confirmed
    );

    if(!user){
        alert("❌ بيانات خاطئة أو الحساب غير مؤكد");
        return;
    }

    localStorage.setItem("loggedIn","true");
    localStorage.setItem("currentUser",email);
    window.location.href="home.html";
};
</script>
</body>
</html>
