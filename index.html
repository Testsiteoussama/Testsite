<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f0f0f0;
    padding: 50px;
}

button {
    padding: 15px 30px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
}

button:hover:not([disabled]) {
    background-color: #45a049;
}

button[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
}

#countdown {
    font-size: 14px;
    color: #555;
    margin-top: 5px;
}

#signUpForm {
    display: none;
    margin-top: 20px;
}

input {
    padding: 10px;
    margin: 10px 0;
    width: 80%;
    max-width: 300px;
}

.homePage {
    display: none;
}
</style>
</head>
<body>

<div class="page1" id="page1">
    <h1>مرحبا بك!</h1>
    <button id="signUpBtn">Sign Up</button>
    <div id="countdown"></div>
</div>

<form id="signUpForm">
    <h3>أدخل معلوماتك للتسجيل</h3>
    <input type="text" id="name" placeholder="اسمك" required><br>
    <input type="email" id="email" placeholder="الإيميل" required><br>
    <input type="password" id="password" placeholder="كلمة المرور" required><br>
    <button type="submit">أرسل رسالة التأكيد</button>
</form>

<div class="homePage" id="homePage">
    <h1>الصفحة الرئيسية</h1>
    <p>أنت الآن مسجل ومؤكد!</p>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("S1Mw-eSIERnBhM8ri"); // ✅ Public Key
</script>

<script>
const signUpBtn = document.getElementById("signUpBtn");
const page1 = document.getElementById("page1");
const signUpForm = document.getElementById("signUpForm");
const countdownEl = document.getElementById("countdown");
const homePage = document.getElementById("homePage");

const WAIT_TIME = 10 * 60 * 1000; // 10 دقائق

// إذا الجهاز مسجل مسبقاً
if(localStorage.getItem("isRegistered") === "true") {
    page1.style.display = "none";
    signUpForm.style.display = "none";
    homePage.style.display = "block";
}

// عد تنازلي إذا ضغط مسبقاً
let lastClickTime = localStorage.getItem("lastClickTime");
if(lastClickTime) {
    const remaining = WAIT_TIME - (Date.now() - lastClickTime);
    if(remaining > 0) {
        startCountdown(Math.floor(remaining/1000));
        disableButton(signUpBtn, true);
    }
}

function disableButton(button, state) {
    button.disabled = state;
}

function startCountdown(seconds) {
    countdownEl.textContent = `انتظر ${seconds} ثانية لإعادة المحاولة`;
    const interval = setInterval(() => {
        seconds--;
        if(seconds <= 0) {
            clearInterval(interval);
            countdownEl.textContent = "";
            disableButton(signUpBtn, false);
        } else {
            countdownEl.textContent = `انتظر ${seconds} ثانية لإعادة المحاولة`;
        }
    }, 1000);
}

// عرض الفورم عند الضغط
signUpBtn.onclick = () => {
    page1.style.display = "none";
    signUpForm.style.display = "block";
};

// إرسال رسالة التأكيد
signUpForm.onsubmit = function(e) {
    e.preventDefault();

    const userName = document.getElementById("name").value;
    const userEmail = document.getElementById("email").value;
    const userPassword = document.getElementById("password").value;

    // سجل وقت الضغط للانتظار
    localStorage.setItem("lastClickTime", Date.now());
    disableButton(signUpBtn, true);
    startCountdown(WAIT_TIME/1000);

    // رابط التأكيد
    const confirmLink = `https://testsiteoussama.github.io/Testsite/confirm.html?email=${encodeURIComponent(userEmail)}`;

    emailjs.send(
        "service_j39gu7v",
        "template_r2sxa0o",
        {
            user_name: userName,
            to_email: userEmail,
            from_name: "موقع التسجيل",
            reply_to: userEmail,
            message: `✅ اضغط على هذا الرابط لتأكيد حسابك: <a href="${confirmLink}" style="color:white; background-color:#4CAF50; padding:5px 10px; text-decoration:none; border-radius:5px;">[تأكيد الحساب]</a>\nكلمة المرور التي أدخلتها: ${userPassword}`
        }
    )
    .then(() => {
        alert("📩 تم إرسال رسالة التأكيد إلى إيميلك. اضغط على الرابط داخل الرسالة لتفعيل الحساب.");
        signUpForm.reset();
        signUpForm.style.display = "none";
        page1.style.display = "block";
    })
    .catch((error) => {
        alert("❌ خطأ في الإرسال");
        console.log(error);
    });
};
</script>

</body>
</html>
