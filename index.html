<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل / دخول</title>
<style>
body { font-family: Arial; text-align:center; background:#f0f0f0; padding:40px; }
button { padding:12px 25px; margin:10px; border:none; border-radius:6px; background:#4CAF50; color:white; cursor:pointer; }
input { display:block; margin:10px auto; padding:10px; width:260px; }
form { display:none; }
</style>
</head>
<body>

<h1>مرحبا بك</h1>
<div id="buttons">
    <button onclick="showSignup()">إنشاء حساب</button>
    <button onclick="showLogin()">تسجيل الدخول</button>
</div>

<!-- SIGN UP FORM -->
<form id="signupForm">
    <h3>إنشاء حساب</h3>
    <input type="email" id="suEmail" placeholder="الإيميل" required>
    <input type="password" id="suPassword" placeholder="كلمة المرور" required>
    <button type="submit">إرسال رسالة التأكيد</button>
</form>

<!-- LOGIN FORM -->
<form id="loginForm">
    <h3>تسجيل الدخول</h3>
    <input type="email" id="liEmail" placeholder="الإيميل" required>
    <input type="password" id="liPassword" placeholder="كلمة المرور" required>
    <button type="submit">دخول</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("S1Mw-eSIERnBhM8ri");

// ======== HELPERS ========
function getAccounts(){ return JSON.parse(localStorage.getItem("accounts")) || []; }
function saveAccounts(acc){ localStorage.setItem("accounts", JSON.stringify(acc)); }

// ======== AUTO REDIRECT IF LOGGED IN ========
if(localStorage.getItem("loggedIn") === "true"){
    window.location.href="home.html";
}

// ======== UI FUNCTIONS ========
function showSignup(){ buttons.style.display="none"; signupForm.style.display="block"; }
function showLogin(){ buttons.style.display="none"; loginForm.style.display="block"; }

// ======== SIGN UP ========
signupForm.onsubmit = function(e){
    e.preventDefault();
    const email = document.getElementById("suEmail").value;
    const password = document.getElementById("suPassword").value;

    let accounts = getAccounts();
    if(accounts.find(a=>a.email===email)){
        alert("❌ هذا الإيميل مسجل مسبقاً");
        return;
    }

    accounts.push({email,password,confirmed:false});
    saveAccounts(accounts);

    const confirmLink = `https://testsiteoussama.github.io/Testsite/confirm.html?email=${encodeURIComponent(email)}`;

    emailjs.send(
        "service_j39gu7v",
        "template_r2sxa0o",
        {
            user_name: "مستخدم جديد",
            to_email: email,
            from_name: "موقع التسجيل",
            reply_to: email,
            message: `✅ اضغط على هذا الرابط لتأكيد حسابك: <a href="${confirmLink}" style="color:white; background-color:#4CAF50; padding:5px 10px; text-decoration:none; border-radius:5px;">[تأكيد الحساب]</a>`
        }
    ).then(()=>{
        alert("📩 تم إرسال رسالة التأكيد. اضغط على الرابط لتفعيل الحساب.");
        signupForm.reset(); signupForm.style.display="none"; buttons.style.display="block";
    }).catch(e=>{ alert("❌ خطأ في الإرسال"); console.log(e); });
}

// ======== LOGIN ========
loginForm.onsubmit = function(e){
    e.preventDefault();
    const email = document.getElementById("liEmail").value;
    const password = document.getElementById("liPassword").value;

    let accounts = getAccounts();
    let acc = accounts.find(a=>a.email===email && a.password===password && a.confirmed);

    if(acc){
        localStorage.setItem("loggedIn","true");
        alert("✅ تسجيل الدخول ناجح");
        window.location.href="home.html";
    } else {
        alert("❌ بيانات غير صحيحة أو الحساب لم يتم تأكيده");
    }
}
</script>

</body>
</html>
