<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f0f0f0;
    padding: 50px;
    overflow-x: hidden;
}

.page1, .homePage {
    transition: all 1s ease;
}

button {
    padding: 15px 30px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    position: relative;
}

button:hover:not([disabled]) {
    background-color: #45a049;
}

button[disabled] {
    opacity: 0.5;
    cursor: not-allowed;
}

#countdown {
    font-size: 14px;
    color: #555;
    margin-top: 5px;
}

#infoForm {
    display: none;
    margin-top: 20px;
}

input {
    padding: 10px;
    margin: 10px 0;
    width: 80%;
    max-width: 300px;
}

.homePage {
    display: none;
}
</style>
</head>
<body>

<div class="page1" id="page1">
    <h1>مرحبا بك!</h1>
    <button id="enterBtn">ادخل معلوماتك</button>
    <div id="countdown"></div>
</div>

<form id="infoForm">
    <h3>اكتب المعلومات المطلوبة</h3>
    <input type="text" id="name" placeholder="اسمك" required><br>
    <input type="email" id="email" placeholder="الإيميل" required><br>
    <button type="submit">أرسل</button>
</form>

<div class="homePage" id="homePage">
    <h1>الصفحة الرئيسية</h1>
    <button id="confirmBtn">تأكيد الحساب عبر الإيميل</button>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("S1Mw-eSIERnBhM8ri"); // ✅ Public Key
</script>

<script>
const enterBtn = document.getElementById("enterBtn");
const page1 = document.getElementById("page1");
const infoForm = document.getElementById("infoForm");
const countdownEl = document.getElementById("countdown");
const homePage = document.getElementById("homePage");
const confirmBtn = document.getElementById("confirmBtn");

const WAIT_TIME = 10 * 60 * 1000; // 10 دقائق

// تحقق إذا المستخدم مسجل مسبقاً
if(localStorage.getItem("isRegistered") === "true") {
    page1.style.display = "none";
    infoForm.style.display = "none";
    homePage.style.display = "block";
}

// تحقق إذا يوجد وقت انتظار
let lastClickTime = localStorage.getItem("lastClickTime");
if(lastClickTime) {
    const remaining = WAIT_TIME - (Date.now() - lastClickTime);
    if(remaining > 0) {
        startCountdown(Math.floor(remaining/1000));
        disableButton(enterBtn, true);
    }
}

function disableButton(button, state) {
    button.disabled = state;
}

function startCountdown(seconds) {
    countdownEl.textContent = `انتظر ${seconds} ثانية لإعادة المحاولة`;
    const interval = setInterval(() => {
        seconds--;
        if(seconds <= 0) {
            clearInterval(interval);
            countdownEl.textContent = "";
            disableButton(enterBtn, false);
        } else {
            countdownEl.textContent = `انتظر ${seconds} ثانية لإعادة المحاولة`;
        }
    }, 1000);
}

enterBtn.onclick = () => {
    // سجل وقت الضغط
    localStorage.setItem("lastClickTime", Date.now());
    disableButton(enterBtn, true);
    startCountdown(WAIT_TIME/1000);
    page1.style.display = "none";
    infoForm.style.display = "block";
};

infoForm.onsubmit = function(e) {
    e.preventDefault();

    const userName = document.getElementById("name").value;
    const userEmail = document.getElementById("email").value;

    emailjs.send(
        "service_j39gu7v",
        "template_r2sxa0o",
        {
            user_name: userName,
            to_email: userEmail,
            from_name: "موقع التسجيل",
            reply_to: userEmail,
            message: "تم تسجيلك بنجاح، شكراً لك!"
        }
    )
    .then(() => {
        alert("✅ تم إرسال رسالة تأكيد إلى إيميلك");
        infoForm.reset();
        localStorage.setItem("isRegistered", "true"); // حفظ حالة التسجيل
        infoForm.style.display = "none";
        homePage.style.display = "block";
    })
    .catch((error) => {
        alert("❌ خطأ في الإرسال");
        console.log(error);
    });
};

// زر تأكيد الحساب
confirmBtn.onclick = () => {
    alert("✅ تم تأكيد الحساب عبر الإيميل");
    localStorage.setItem("isRegistered", "true");
};
</script>
</body>
</html>
