<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f0f0f0;
    padding: 50px;
    overflow-x: hidden;
}

.page1 {
    transition: all 1s ease;
}

button {
    padding: 15px 30px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
}

button:hover {
    background-color: #45a049;
}

#infoForm {
    display: none;
    margin-top: 20px;
}

input {
    padding: 10px;
    margin: 10px 0;
    width: 80%;
    max-width: 300px;
}
</style>
</head>

<body>

<div class="page1" id="page1">
    <h1>مرحبا بك!</h1>
    <button id="enterBtn">ادخل معلوماتك</button>
</div>

<form id="infoForm">
    <h3>اكتب المعلومات المطلوبة</h3>
    <input type="text" id="name" placeholder="اسمك" required><br>
    <input type="email" id="email" placeholder="الإيميل" required><br>
    <button type="submit">أرسل</button>
</form>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
emailjs.init("S1Mw-eSIERnBhM8ri"); // ✅ Public Key
</script>

<script>
const enterBtn = document.getElementById("enterBtn");
const page1 = document.getElementById("page1");
const infoForm = document.getElementById("infoForm");

enterBtn.onclick = () => {
    page1.style.display = "none";
    infoForm.style.display = "block";
};

infoForm.onsubmit = function(e) {
    e.preventDefault();

    const userName = document.getElementById("name").value;
    const userEmail = document.getElementById("email").value;

    emailjs.send(
        "service_j39gu7v",
        "template_r2sxa0o",
        {
            user_name: userName,
            to_email: userEmail,
            from_name: "موقع التسجيل",
            reply_to: userEmail,
            message: "تم تسجيلك بنجاح، شكراً لك!"
        }
    )
    .then(() => {
        alert("✅ تم إرسال رسالة تأكيد إلى إيميلك");
        infoForm.reset();
    })
    .catch((error) => {
        alert("❌ خطأ في الإرسال");
        console.log(error);
    });
};
</script>

</body>
</html>
