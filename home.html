<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة الرئيسية</title>
<style>
body { font-family: Arial; text-align:center; background:#f0f0f0; padding:40px; }
button { padding:10px 20px; margin:10px; border:none; border-radius:5px; cursor:pointer; }
.logout { background:#f44336; color:white; }
input { display:block; margin:10px auto; padding:10px; width:250px; }
#changePass { display:none; }
</style>
</head>
<body>

<h1>الصفحة الرئيسية</h1>
<p>أنت مسجل دخولًا ✅</p>

<button onclick="showChange()">تغيير كلمة المرور</button>
<button class="logout" onclick="logout()">تسجيل الخروج</button>

<div id="changePass">
    <input type="password" id="oldPass" placeholder="كلمة المرور القديمة">
    <input type="password" id="newPass" placeholder="كلمة المرور الجديدة">
    <button onclick="changePassword()">حفظ</button>
</div>

<script>
if(
    localStorage.getItem("loggedIn") !== "true" ||
    !localStorage.getItem("currentUser")
){
    location.href="index.html";
}

const email = localStorage.getItem("currentUser");

function logout(){
    if(confirm("هل أنت متأكد من تسجيل الخروج؟")){
        localStorage.clear();
        location.href="index.html";
    }
}

function showChange(){
    changePass.style.display="block";
}

function changePassword(){
    let accounts = JSON.parse(localStorage.getItem("accounts")) || [];
    let user = accounts.find(a=>a.email===email);

    if(user.password !== oldPass.value){
        alert("❌ كلمة المرور القديمة خاطئة");
        return;
    }

    user.password = newPass.value;
    localStorage.setItem("accounts", JSON.stringify(accounts));
    alert("✅ تم تغيير كلمة المرور");
    changePass.style.display="none";
}
</script>

</body>
</html>
