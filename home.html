<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة الرئيسية</title>
<style>
body { font-family: Arial; text-align:center; background:#f0f0f0; padding:40px; }
button { padding:10px 20px; margin-top:10px; border:none; border-radius:5px; background:#4CAF50; color:white; cursor:pointer; }
.logoutBtn { background:#f44336; }
input { display:block; margin:10px auto; padding:10px; width:250px; }
#changePassForm { display:none; margin-top:20px; }
</style>
</head>
<body>

<h1>الصفحة الرئيسية</h1>
<p>أنت الآن مسجل ومؤكد ✅</p>

<button class="logoutBtn" onclick="logout()">تسجيل الخروج</button>
<button onclick="showChangePass()">تغيير كلمة المرور</button>

<!-- CHANGE PASSWORD FORM -->
<div id="changePassForm">
    <h3>تغيير كلمة المرور</h3>
    <input type="password" id="oldPass" placeholder="كلمة المرور القديمة" required>
    <input type="password" id="newPass" placeholder="كلمة المرور الجديدة" required>
    <button onclick="changePassword()">تحديث كلمة المرور</button>
</div>

<script>
// حماية الصفحة
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="index.html";
}

// جلب البريد الحالي
const currentEmail = localStorage.getItem("currentUser");

// تسجيل الخروج مع تأكيد
function logout(){
    if(confirm("⚠️ هل أنت متأكد من تسجيل الخروج؟")){
        localStorage.removeItem("loggedIn");
        localStorage.removeItem("currentUser");
        window.location.href="index.html";
    }
}

// إظهار فورم تغيير كلمة المرور
function showChangePass(){
    document.getElementById("changePassForm").style.display = "block";
}

// تغيير كلمة المرور
function changePassword(){
    const oldPass = document.getElementById("oldPass").value;
    const newPass = document.getElementById("newPass").value;

    let accounts = JSON.parse(localStorage.getItem("accounts")) || [];
    let user = accounts.find(a => a.email === currentEmail);

    if(!user){
        alert("❌ خطأ: الحساب غير موجود");
        return;
    }

    if(user.password !== oldPass){
        alert("❌ كلمة المرور القديمة غير صحيحة");
        return;
    }

    user.password = newPass;
    localStorage.setItem("accounts", JSON.stringify(accounts));
    alert("✅ تم تحديث كلمة المرور بنجاح");
    document.getElementById("changePassForm").reset?.(); // لو فيه reset
    document.getElementById("changePassForm").style.display = "none";
}
</script>

</body>
</html>
